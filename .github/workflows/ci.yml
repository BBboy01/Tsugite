name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      - name: Check database migrations
        run: bunx --no-install drizzle-kit check

      - name: Apply migrations to a fresh database
        run: |
          temp_db="$(mktemp)"
          trap 'rm -f "$temp_db"' EXIT
          DATABASE_PATH="$temp_db" bun run db:migrate

      - name: Run tests
        run: bun test apps packages --coverage --coverage-reporter=lcov

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: true
          disable_search: true

      - name: Run lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Audit unused project surface
        run: bun run knip -- --no-exit-code --reporter compact

      - name: Build application
        run: bun run build
