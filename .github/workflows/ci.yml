name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      - name: Check database migrations
        run: bunx --no-install drizzle-kit check

      - name: Apply migrations to a fresh database
        run: |
          temp_db="$(mktemp)"
          trap 'rm -f "$temp_db"' EXIT
          DATABASE_PATH="$temp_db" bun run db:migrate

      - name: Run tests
        run: bun test apps packages --coverage --coverage-reporter=lcov

      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: true
          disable_search: true

      - name: Run lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Audit unused project surface
        run: bun run knip -- --no-exit-code --reporter compact

      - name: Build application
        run: bun run build
