[remote.github]
owner = "BBboy01"
repo = "Tsugite"

[changelog]
header = """
# Changelog

All notable changes to Tsugite are documented here.
"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }}{% else %}## Unreleased{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\\n") | first | trim | upper_first }}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }}){% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "✨ Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs?", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^build", group = "📦 Build" },
  { message = "^ci", group = "🤖 Continuous Integration" },
  { message = "^chore\\(deps", group = "⬆️ Dependencies" },
  { message = "^chore|^meta|^style|^license", group = "🛠️ Maintenance" },
  { message = "^revert", group = "↩️ Reverts" },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"
